name: CI/CD

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      seed_admin:
        description: Create the first admin account (one-off) instead of the normal flow
        type: boolean
        default: false
      seed_environment:
        description: Environment to seed
        type: choice
        options: [pre-production, production]
        default: pre-production

permissions:
  contents: read

jobs:
  test:
    name: Lint, test and build
    if: ${{ !inputs.seed_admin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build?schema=public

  deploy:
    name: Deploy to Google Cloud
    needs: test
    if: ${{ !inputs.seed_admin && github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'pre-production' }}
    permissions:
      contents: read
      id-token: write
    # Never overlap deployments within either environment, and never cancel one midway.
    concurrency:
      group: ${{ github.ref == 'refs/heads/main' && 'production' || 'pre-production' }}-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Skip (instead of failing) when the environment has no GCP configuration.
      - name: Check GCP configuration
        id: gcp
        env:
          WIF_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$WIF_PROVIDER" ] && [ -n "$DEPLOY_SA" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::GCP secrets are not set for the '${{ github.ref == 'refs/heads/main' && 'production' || 'pre-production' }}' environment; skipping deploy."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: google-github-actions/auth@v2
        if: steps.gcp.outputs.configured == 'true'
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gcp.outputs.configured == 'true'

      # deploy-gcp.sh reads these git-ignored files; rebuild them from GitHub secrets.
      - name: Write deployment configuration
        if: steps.gcp.outputs.configured == 'true'
        env:
          GCP_ENV: ${{ secrets.GCP_ENV }}
          GCP_SECRETS_ENV: ${{ secrets.GCP_SECRETS_ENV }}
        run: |
          printf '%s\n' "$GCP_ENV" > deploy/gcp.env
          printf '%s\n' "$GCP_SECRETS_ENV" > deploy/gcp.secrets.env
          # Compose only needs these to resolve the build config; .env is not copied into images.
          printf 'POSTGRES_DB=ci\nPOSTGRES_USER=ci\nPOSTGRES_PASSWORD=ci\n' > .env

      - name: Deploy
        if: steps.gcp.outputs.configured == 'true'
        env:
          IMAGE_TAG: ${{ github.sha }}
          # Keep develop isolated from production resources and data.
          APP_NAME: ${{ github.ref == 'refs/heads/develop' && 'order-request-preprod' || 'order-request' }}
          WEB_SERVICE: ${{ github.ref == 'refs/heads/develop' && 'web-preprod' || 'web' }}
          WORKER_SERVICE: ${{ github.ref == 'refs/heads/develop' && 'worker-preprod' || 'worker' }}
        run: bash deploy/deploy-gcp.sh

  seed-admin:
    name: Seed admin (one-off)
    if: ${{ inputs.seed_admin }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.seed_environment }}
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ inputs.seed_environment }}-seed-admin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      # Clones the already-deployed migrate job (same image, service account, Cloud SQL and
      # secrets), swaps the command for the seed script, runs it once, then deletes it.
      # The admin credentials come from this environment's secrets and exist only in the
      # temporary job definition.
      - name: Seed admin
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_NAME: Shop Administrator
          APP_NAME: ${{ inputs.seed_environment == 'production' && 'order-request' || 'order-request-preprod' }}
        run: |
          set -euo pipefail
          [ -n "$ADMIN_EMAIL" ] && [ -n "$ADMIN_PASSWORD" ] || { echo "::error::Set ADMIN_EMAIL and ADMIN_PASSWORD secrets on the environment."; exit 1; }
          set -a; . deploy/gcp.config; set +a
          APP_NAME_OVERRIDE="$APP_NAME"
          REGION="${REGION}"
          SEED_JOB="${APP_NAME_OVERRIDE}-seed-admin"
          gcloud run jobs describe "${APP_NAME_OVERRIDE}-migrate" --region "$REGION" --format=export > /tmp/job.yaml
          python3 - "$SEED_JOB" <<'PY'
          import os, sys, yaml
          d = yaml.safe_load(open('/tmp/job.yaml'))
          d['metadata']['name'] = sys.argv[1]
          d.pop('status', None)
          for k in ('resourceVersion', 'uid', 'generation', 'creationTimestamp', 'selfLink'):
              d['metadata'].pop(k, None)
          c = d['spec']['template']['spec']['template']['spec']['containers'][0]
          c['command'] = ['node']
          c['args'] = ['scripts/seed-admin.mjs']
          env = c.setdefault('env', [])
          for k in ('ADMIN_EMAIL', 'ADMIN_PASSWORD', 'ADMIN_NAME'):
              env.append({'name': k, 'value': os.environ[k]})
          yaml.safe_dump(d, open('/tmp/seed-job.yaml', 'w'))
          PY
          trap 'gcloud run jobs delete "$SEED_JOB" --region "$REGION" --quiet || true; rm -f /tmp/job.yaml /tmp/seed-job.yaml' EXIT
          gcloud run jobs replace /tmp/seed-job.yaml --region "$REGION"
          gcloud run jobs execute "$SEED_JOB" --region "$REGION" --wait
