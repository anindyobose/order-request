services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5433:5432"

  migrate:
    build:
      context: .
      target: web
    restart: "no"
    env_file: .env
    environment: &app-environment
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      DB_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_SSL: "false"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "migrate"]

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
      PORT: ${PORT:-3000}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000:${PORT:-3000}"
    volumes:
      - product_uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:' + (process.env.PORT || 3000) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  product_uploads:
